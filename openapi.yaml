openapi: 3.1.0
info:
  title: CivicLens API
  version: 0.2.0
  summary: Public-sector data analytics engine — ingest, profile, clean, model, predict and report.
  description: |
    Contract-first definition (v0, Phase 4). The FastAPI implementation (Phase 5) must match it;
    Schemathesis checks that in CI from Phase 8.

    **Languages.** Machine fields (`issue_type`, `kpi_id`, `field`, codes, numbers) are always English
    and stable. Human-readable fields (`title`, `message`, `explanation`, `detail`) are localized with
    `Accept-Language` (`en` default, `es` supported); the response carries `Content-Language`.
    Data values are never translated. See ADR-0007.

    **Errors** use RFC 7807 (`application/problem+json`) with a stable `code`.
    `x-user-stories` on every operation links to `docs/requirements.md`.
  contact:
    name: CivicLens
    url: https://github.com/MariaAlejandraBoadaRodriguez/civiclens
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local (docker compose)
security:
  - ApiKey: []
tags:
  - name: ops
    description: Liveness and readiness.
  - name: datasets
    description: Upload, list and profile datasets (M1, M2).
  - name: cleaning
    description: Issues and cleaning recipes (M3).
  - name: sql
    description: Read-only SQL over the star schema, guided queries and KPIs (M4).
  - name: models
    description: Red flags and forecasting (M6).
  - name: jobs
    description: Asynchronous work.
  - name: dashboard
    description: Executive dashboard and cross-jurisdiction comparison in CAD (M5).
  - name: reports
    description: Executive report (M5).
  - name: admin
    description: API-key management (admin only).

paths:

  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness probe
      description: Used by the uptime monitor and deploy smoke tests. No authentication.
      security: []
      x-user-stories: [US-26]
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/datasets:
    get:
      tags: [datasets]
      operationId: listDatasets
      summary: List datasets
      description: Seed datasets are always listed first; uploads appear until they expire (24 h).
      security: [{}, ApiKey: []]
      x-user-stories: [US-06, US-27]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: source
          in: query
          description: Filter by source.
          schema:
            $ref: "#/components/schemas/DatasetSource"
      responses:
        "200":
          description: Datasets.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [datasets]
      operationId: uploadDataset
      summary: Upload a file
      description: |-
        CSV, XLSX or JSON up to 50 MB, deleted after 24 h. Ingest + profile run as a job; poll
        `GET /api/v1/jobs/{job_id}`.

        With an API key, the key needs the `datasets:write` scope. Anonymous calls are accepted only while the server allows anonymous writes (public demo).
      security: [{}, ApiKey: []]
      x-user-stories: [US-07, US-25]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The file to ingest.
                name:
                  type: string
                  maxLength: 255
                  description: Display name; defaults to the file name.
      responses:
        "202":
          description: Accepted; ingestion job created.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}:
    get:
      tags: [datasets]
      operationId: getDataset
      summary: Get one dataset
      description: Metadata, status and detected data language.
      security: [{}, ApiKey: []]
      x-user-stories: [US-07]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The dataset.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}/profile:
    get:
      tags: [datasets]
      operationId: getDatasetProfile
      summary: Data-quality profile
      description: Per-column profile, header mapping to the canonical schema, quality score and PII findings.
      security: [{}, ApiKey: []]
      x-user-stories: [US-03, US-08, US-09, US-10]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The profile.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}/issues:
    get:
      tags: [cleaning]
      operationId: listDatasetIssues
      summary: Detected data issues
      description: |
        One entry per issue card, in pipeline order, with localized what / why / options texts.
        Previews and KPI impacts are computed assuming earlier issues use their recommended option.
      security: [{}, ApiKey: []]
      x-user-stories: [US-04, US-11, US-14]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Issues.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: object
                required: [dataset, issues, columns]
                properties:
                  dataset:
                    $ref: "#/components/schemas/Dataset"
                  quality:
                    $ref: "#/components/schemas/Quality"
                  quality_after:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/Quality"
                  columns:
                    type: array
                    description: Staged column names (for the SQL export).
                    items:
                      type: string
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                  op_labels:
                    type: object
                    description: Localized names of recipe operations.
                    additionalProperties:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}/recipes/apply:
    post:
      tags: [cleaning]
      operationId: applyRecipe
      summary: Apply a cleaning recipe
      description: "Replays a saved recipe (by id) or an inline recipe on the dataset. Deterministic output (same input + recipe → same hash).\n\nWith an API key, the key needs the `recipes:write` scope. Anonymous calls are accepted only while the server allows anonymous writes (public demo)."
      x-user-stories: [US-12, US-14, US-25]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRecipeRequest"
      responses:
        "202":
          description: Accepted; job created.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

      security:
        - {}
        - ApiKey: []

  /api/v1/datasets/{dataset_id}/schema:
    get:
      tags: [sql]
      operationId: getStarSchema
      summary: Analysis model of a dataset
      description: |
        Every dataset has the table `data`: the cleaned columns of the file, typed, with safe
        snake_case names (`data_columns` gives each one's header, kind, SQL type and examples).
        Procurement data (Government pack) also gets the star schema (`fact_contract` + 5
        dimensions). Built on first use from the cleaned layer; when no recipe was applied yet,
        from the staged layer with the recommended recipe (`origin: recommended`).
      security: [{}, ApiKey: []]
      x-user-stories: [US-15, US-16, US-28]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Tables, columns and the active domain pack.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}/domain:
    get:
      tags: [datasets]
      operationId: getDomain
      summary: Domain pack, goal and column roles
      description: |
        The active domain pack (the user's choice, else CivicLens's suggestion), its analysis
        goal and the mapping of its semantic roles to the file's columns, each with a confidence;
        plus every pack with its fit score, the pack catalog and the columns to choose from.
      security: [{}, ApiKey: []]
      x-user-stories: [US-29]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The domain choice.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [datasets]
      operationId: setDomain
      summary: Confirm or change the domain pack and roles
      description: |
        Stores the user's pack, goal and role mapping (omit `roles` to accept the suggestion).
        Roles that are not mapped drop the pack items that need them; the generic analysis
        stays. Switching to or from the Government pack rebuilds the model in a background job
        (`job`); any other change applies at once. Sample datasets keep their domain (409).
        Needs `recipes:write` with an API key.
      security: [{}, ApiKey: []]
      x-user-stories: [US-29]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainChoice"
      responses:
        "200":
          description: The stored choice.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/recipes:
    post:
      tags: [cleaning]
      operationId: createRecipe
      summary: Save a recipe version
      description: "Saving with an existing name creates the next version.\n\nWith an API key, the key needs the `recipes:write` scope. Anonymous calls are accepted only while the server allows anonymous writes (public demo)."
      x-user-stories: [US-12]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Created.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
        - {}
        - ApiKey: []

  /api/v1/recipes/preview:
    post:
      tags: [cleaning]
      operationId: previewRecipeCode
      summary: Preview a recipe as code
      description: pandas pipeline, DuckDB SQL and the JSON document for unsaved steps (live recipe panel). Code is never localized.
      security: [{}, ApiKey: []]
      x-user-stories: [US-12, US-13]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  items:
                    $ref: "#/components/schemas/RecipeStep"
                columns:
                  type: array
                  items:
                    type: string
                name:
                  type: string
      responses:
        "200":
          description: Generated code.
          content:
            application/json:
              schema:
                type: object
                required: [pandas, sql, json]
                properties:
                  pandas:
                    type: string
                  sql:
                    type: string
                  json:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/recipes/{recipe_id}:
    get:
      tags: [cleaning]
      operationId: getRecipe
      summary: Get a recipe
      description: The recipe JSON with its steps.
      x-user-stories: [US-12]
      parameters:
        - $ref: "#/components/parameters/RecipeId"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
        - {}
        - ApiKey: []

  /api/v1/recipes/{recipe_id}/export:
    get:
      tags: [cleaning]
      operationId: exportRecipe
      summary: Export a recipe as code
      description: Generated pandas script or equivalent SQL. Code is never localized.
      security: [{}, ApiKey: []]
      x-user-stories: [US-13]
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - name: format
          in: query
          required: false
          description: Target language of the generated code.
          schema:
            type: string
            enum: [pandas, sql, json]
            default: pandas
      responses:
        "200":
          description: Generated code.
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDocument"
            text/x-python:
              schema:
                type: string
            application/sql:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/query:
    post:
      tags: [sql]
      operationId: runQuery
      summary: Run read-only SQL
      description: Single SELECT/WITH over the dataset's star schema. 10 s timeout, 10,000-row cap.
      security: [{}, ApiKey: []]
      x-user-stories: [US-15, US-16]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Result set.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/Timeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/guided-queries:
    get:
      tags: [sql]
      operationId: listGuidedQueries
      summary: Guided query library
      description: |
        Guided questions with SQL (identical in every language) and localized explanations.
        With `dataset_id`: the questions for that file — the domain pack's curated questions (its
        goal's first), then questions generated from the file's own columns (counts, rates,
        summaries, distributions, segments, trends, outliers, correlations), plus the 12
        procurement questions for procurement data. Without it: the 12 procurement questions.
      security: [{}, ApiKey: []]
      x-user-stories: [US-15, US-28, US-29]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: dataset_id
          in: query
          required: false
          description: Dataset UUID or seed slug.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Guided queries.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuidedQuery"
                  guardrails:
                    $ref: "#/components/schemas/Guardrails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/kpis/{dataset_id}:
    get:
      tags: [sql]
      operationId: getKpis
      summary: KPIs for a dataset
      description: |
        Values with a stable `kpi_id` and localized names and definitions. Procurement data: the
        KPI catalog, monetary KPIs in CAD (each amount converted with the rate of its signed
        month). Any other data: the domain pack's KPIs (`<pack>.<id>`) whose roles are mapped,
        then KPIs of the table itself (`generic.*`: rows, completeness, means, rates …).
      security: [{}, ApiKey: []]
      x-user-stories: [US-17, US-22, US-23, US-25, US-28]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: KPIs.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: object
                required: [dataset_id, items]
                properties:
                  dataset_id:
                    type: string
                    format: uuid
                  origin:
                    $ref: "#/components/schemas/StarOrigin"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kpi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/models/{model_type}/run:
    post:
      tags: [models]
      operationId: runModel
      summary: Run a model
      description: |-
        Trains and scores on the cleaned data. Fixed seed → reproducible output. The job result
        holds a summary; the full result and model card come from
        `GET /api/v1/models/{model_type}/latest`.
        - Any dataset (table `data`): `target_model` (predicts `params.target`, default: the
          domain pack's target role or the table's yes/no column; task chosen from the column
          kind; baseline, metrics, permutation importance, leakage warnings, fairness check
          across sensitive groups, which are never inputs), `anomalies`, `segments`, and
          `forecast` (monthly, on the first date column and the main quantity).
        - Procurement data only (star schema): `red_flags` (409 `domain.procurement_only`
          otherwise); `forecast` then forecasts spend in CAD.
        - `classifier` is not available yet (404 `model.not_available`).

        With an API key, the key needs the `models:run` scope. Anonymous calls are accepted only while the server allows anonymous writes (public demo).
      x-user-stories: [US-18, US-19, US-20, US-21, US-25, US-28]
      parameters:
        - $ref: "#/components/parameters/ModelType"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id]
              properties:
                dataset_id:
                  type: string
                  description: Dataset UUID, or the slug of a seed dataset.
                  example: contracts_ca
                params:
                  type: object
                  description: |
                    `forecast` on procurement data: `entity_id` restricts the series to one
                    entity. `target_model`: `target` (a column of table `data`) and `positive`
                    (the target value that means yes).
                  properties:
                    entity_id:
                      type: [string, "null"]
                    target:
                      type: [string, "null"]
                      maxLength: 200
                      example: credit_risk
                    positive:
                      type: [string, "null"]
                      maxLength: 200
      responses:
        "202":
          description: Accepted; poll the job in `Location`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
        - {}
        - ApiKey: []

  /api/v1/models/{model_type}/latest:
    get:
      tags: [models]
      operationId: getLatestModelResult
      summary: Latest model result with its model card
      description: |
        Machine fields (ids, scores, metrics, reason ids, feature ids) are identical in every
        language; the `card` (question, method, warning, limitations, verdict) and
        `reason_labels` follow `Accept-Language`.
      security: [{}, ApiKey: []]
      x-user-stories: [US-18, US-19, US-28]
      parameters:
        - $ref: "#/components/parameters/ModelType"
        - name: dataset_id
          in: query
          required: true
          description: Dataset UUID, or the slug of a seed dataset.
          schema:
            type: string
            example: contracts_qc
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Result and model card.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RedFlagResult"
                  - $ref: "#/components/schemas/ForecastResult"
                  - $ref: "#/components/schemas/GenericModelResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/models/red_flags/reviews:
    post:
      tags: [models]
      operationId: markReviewed
      summary: Mark a flagged contract as reviewed
      description: "Human-in-the-loop status, kept with the dataset across re-runs. `reviewed=false` undoes it.\n\nWith an API key, the key needs the `models:run` scope. Anonymous calls are accepted only while the server allows anonymous writes (public demo)."
      security: [{}, ApiKey: []]
      x-user-stories: [US-18]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, contract_id]
              properties:
                dataset_id:
                  type: string
                  minLength: 1
                contract_id:
                  type: string
                  minLength: 1
                  maxLength: 200
                reviewed:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Contracts marked as reviewed.
          content:
            application/json:
              schema:
                type: object
                required: [dataset_id, reviewed]
                properties:
                  dataset_id:
                    type: string
                    format: uuid
                  reviewed:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job status
      description: Poll until `status` is `succeeded` or `failed`. Errors carry a stable `error_code` plus a localized message.
      security: [{}, ApiKey: []]
      x-user-stories: [US-25]
      parameters:
        - name: job_id
          in: path
          required: true
          description: Job id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: The job.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Executive dashboard
      description: |
        KPIs, monthly spend and a by-jurisdiction comparison for one or several datasets, all in
        CAD. Several datasets are combined exactly (one HHI over every supplier, one median).
        `12m` is each dataset's last 12 months of data; `fy` its last fiscal year holding at
        least 10 % of its contracts (Colombia: calendar year; Canada and Québec: April–March).
        Procurement data only for now: other datasets answer 409 `domain.procurement_only`.
      security: [{}, ApiKey: []]
      x-user-stories: [US-22, US-23]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: dataset_id
          in: query
          required: true
          description: Dataset UUID or seed slug; repeat for a comparison (at most 5).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 5
            items:
              type: string
              minLength: 1
              maxLength: 64
        - name: period
          in: query
          schema:
            type: string
            enum: [all, 12m, fy]
            default: all
        - name: category
          in: query
          schema:
            type: string
            enum: [all, goods, services, construction, other]
            default: all
      responses:
        "200":
          description: Dashboard.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}/download:
    get:
      tags: [cleaning]
      operationId: downloadCleanedData
      x-user-stories: [US-12, US-13]
      summary: Download the cleaned data
      description: |
        The data with the cleaning decisions applied: the clean layer once a recipe was applied
        (`X-CivicLens-Origin: clean`), otherwise the recommended options applied on the fly
        (`recommended`). The recipe itself is downloaded from `/api/v1/recipes/{recipe_id}/export`.
      security: [{}, ApiKey: []]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, parquet]
            default: csv
      responses:
        "200":
          description: The file.
          headers:
            X-CivicLens-Origin:
              description: "`clean` or `recommended`."
              schema:
                type: string
                enum: [clean, recommended]
          content:
            text/csv:
              schema:
                type: string
            application/vnd.apache.parquet:
              schema:
                type: string
                contentMediaType: application/vnd.apache.parquet
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/datasets/{dataset_id}/export:
    get:
      tags: [sql]
      operationId: exportStarSchema
      summary: Analysis model for Power BI / Tableau
      description: |
        A zip with one CSV or Parquet file per table of the model and a README: `data` for every
        dataset, plus the star-schema tables for procurement data.
      security: [{}, ApiKey: []]
      x-user-stories: [US-23]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, parquet]
            default: csv
      responses:
        "200":
          description: The zip.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/reports/{dataset_id}:
    get:
      tags: [reports]
      operationId: getReport
      summary: Executive report
      description: "Self-contained HTML or A4 PDF report in the requested language. `lang` wins over `Accept-Language`.\n\nWith an API key, the key needs the `reports:read` scope."
      security: [{}, ApiKey: []]
      x-user-stories: [US-05]
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: lang
          in: query
          description: Report language.
          schema:
            $ref: "#/components/schemas/UiLanguage"
        - name: format
          in: query
          description: Output format.
          schema:
            type: string
            enum: [html, pdf]
            default: html
      responses:
        "200":
          description: The report.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/keys:
    get:
      tags: [admin]
      operationId: listApiKeys
      summary: List API keys
      description: Never returns the secret, only the public prefix.
      security:
        - AdminBearer: []
      x-user-stories: [US-24]
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [admin]
      operationId: createApiKey
      summary: Create an API key
      description: The full key is returned once in this response; only its argon2 hash is stored.
      security:
        - AdminBearer: []
      x-user-stories: [US-24]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  maxLength: 120
                  minLength: 1
                scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/Scope"
                  minItems: 1
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/keys/{key_id}:
    delete:
      tags: [admin]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Sets `revoked_at`; the key stops working immediately.
      security:
        - AdminBearer: []
      x-user-stories: [US-24]
      parameters:
        - name: key_id
          in: path
          required: true
          description: Key id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Agency key (scoped, revocable). Read-only demo endpoints also work without a key, with a lower rate limit.
    AdminBearer:
      type: http
      scheme: bearer
      description: Session token for the single admin (GitHub OAuth via the web app).

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Language of human-readable fields. `en` (default) or `es`; anything else falls back to `en`.
      schema:
        type: string
        example: es
    DatasetId:
      name: dataset_id
      in: path
      required: true
      description: Dataset UUID, or the slug of a seed dataset (`secop_co`, `contracts_ca`, `contracts_qc`).
      schema:
        type: string
        example: secop_co
    ModelType:
      name: model_type
      in: path
      required: true
      description: Which model. `red_flags` needs procurement data; `classifier` is a stretch goal (404 `model.not_available` for now).
      schema:
        type: string
        enum: [red_flags, forecast, target_model, anomalies, segments, classifier]
    RecipeId:
      name: recipe_id
      in: path
      required: true
      description: Recipe id.
      schema:
        type: string
        format: uuid

  headers:
    ContentLanguage:
      description: Language actually used for human-readable fields.
      schema:
        $ref: "#/components/schemas/UiLanguage"

  responses:
    BadRequest:
      description: Invalid request (e.g. rejected SQL, malformed recipe).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, invalid or revoked API key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The key lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Resource not ready (e.g. profile still running).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Timeout:
      description: Query exceeded the 10 s limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: File larger than 50 MB.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Not a CSV, XLSX or JSON file.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Valid JSON that fails validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    UiLanguage:
      type: string
      enum: [en, es]
    DataLanguage:
      type: string
      enum: [en, fr, es, mixed, unknown]
    Currency:
      type: string
      enum: [COP, CAD, USD]
    Scope:
      type: string
      enum: [datasets:write, recipes:write, models:run, reports:read]
    DatasetSource:
      type: string
      enum: [seed, upload, api]
    DatasetStatus:
      type: string
      enum: [uploaded, profiled, cleaned, modeled, failed, expired]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    Health:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        commit:
          type: [string, "null"]
          description: Git commit of the running deploy (Render's RENDER_GIT_COMMIT); null locally.

    Problem:
      type: object
      description: RFC 7807 problem details. `code` and `params` are stable; `title` and `detail` are localized.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://civiclens.dev/problems/sql.forbidden_statement
        title:
          type: string
          example: Only read-only queries are allowed
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: sql.forbidden_statement
        params:
          type: object
          additionalProperties: true

    Dataset:
      type: object
      required: [id, name, source, format, data_lang, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: [string, "null"]
          example: secop_co
        name:
          type: string
        source:
          $ref: "#/components/schemas/DatasetSource"
        format:
          type: string
          enum: [csv, xlsx, json, parquet]
        data_lang:
          $ref: "#/components/schemas/DataLanguage"
        status:
          $ref: "#/components/schemas/DatasetStatus"
        rows:
          type: [integer, "null"]
        columns:
          type: [integer, "null"]
        quality_score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        description:
          type: [string, "null"]
          description: Localized description (seed datasets only).
        license:
          type: [string, "null"]
          description: Seed datasets only, e.g. "CC BY-SA 4.0".
        source_url:
          type: [string, "null"]
          format: uri
        jurisdiction:
          type: [string, "null"]
          enum: [CO, CA, QC, null]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time

    DatasetAccepted:
      type: object
      required: [dataset, job]
      properties:
        dataset:
          $ref: "#/components/schemas/Dataset"
        job:
          $ref: "#/components/schemas/JobRef"

    ColumnProfile:
      type: object
      required: [source_header, inferred_type, null_ratio, distinct, validity, consistency]
      properties:
        source_header:
          type: string
          description: Header exactly as in the file (data, never translated).
          example: fecha_de_firma
        canonical_field:
          type: [string, "null"]
          example: signed_date
        canonical_type:
          type: [string, "null"]
          enum: [string, integer, number, date, category, currency, null]
        label:
          type: [string, "null"]
          description: Localized label of the canonical field.
        mapping_confidence:
          type: number
          minimum: 0
          maximum: 1
        needs_check:
          type: boolean
          description: True when the mapping confidence is below 0.8.
        candidates:
          type: array
          description: Best canonical fields for the override select.
          items:
            type: string
        candidate_labels:
          type: object
          additionalProperties:
            type: string
        inferred_type:
          type: string
          enum: [string, integer, number, date, datetime, boolean, category]
        validity:
          type: number
          description: Share of non-null values that parse as the column type.
        consistency:
          type: number
          description: Share of non-null values in the dominant notation / spelling.
        notations:
          type: object
          description: Histogram of number notations (`point`, `comma`) or date formats (`iso`, `dmy`, `mdy`, `ambiguous`, ...).
          additionalProperties:
            type: integer
        null_ratio:
          type: number
        null_tokens:
          type: object
          description: How missing values are written (e.g. `N/A`, `sin dato`) and how often.
          additionalProperties:
            type: integer
        non_null:
          type: integer
        distinct:
          type: integer
        min:
          description: Minimum parsed value as a string (data).
          type: [string, "null"]
        max:
          type: [string, "null"]
        top_values:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              count:
                type: integer
        data_lang:
          type: object
          description: Share of each data language among text cells.
          additionalProperties:
            type: number
        pii_kind:
          type: [string, "null"]
          enum: [email, phone, national_id, person_name, null]
        pii_label:
          type: [string, "null"]

    Profile:
      type: object
      required: [dataset, read, rows, columns_count, quality, columns]
      properties:
        dataset:
          $ref: "#/components/schemas/Dataset"
        read:
          type: object
          description: What the reader detected.
          properties:
            format:
              type: string
              enum: [csv, xlsx, json, parquet]
            encoding:
              type: [string, "null"]
            encoding_label:
              type: [string, "null"]
            delimiter:
              type: [string, "null"]
            sheet:
              type: [string, "null"]
            header_row:
              type: integer
            records_path:
              type: [string, "null"]
        size_bytes:
          type: [integer, "null"]
        rows:
          type: integer
        columns_count:
          type: integer
        duplicate_rows:
          type: integer
        duplicate_keys:
          type: integer
        invalid_rows:
          type: integer
        inconsistent_rows:
          type: integer
        data_lang:
          type: object
          description: Share of each detected data language.
          additionalProperties:
            type: number
        data_lang_label:
          $ref: "#/components/schemas/DataLanguage"
        quality:
          type: object
          required: [score, completeness, uniqueness, validity, consistency]
          properties:
            score:
              type: integer
            completeness:
              type: integer
            uniqueness:
              type: integer
            validity:
              type: integer
            consistency:
              type: integer
        pii:
          type: array
          items:
            type: object
            required: [field, kind, label]
            properties:
              field:
                type: string
              kind:
                type: string
              label:
                type: string
        storage:
          type: object
          additionalProperties:
            type: string
        is_seed:
          type: boolean
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnProfile"

    Quality:
      type: object
      required: [score, completeness, uniqueness, validity, consistency]
      properties:
        score:
          type: integer
        completeness:
          type: integer
        uniqueness:
          type: integer
        validity:
          type: integer
        consistency:
          type: integer

    IssueOption:
      type: object
      required: [option_id, label, steps, recommended]
      properties:
        option_id:
          type: string
          example: to_cad
        label:
          type: string
        hint:
          type: string
        recommended:
          type: boolean
        steps:
          type: array
          description: Recipe steps this option adds (empty = keep as is).
          items:
            $ref: "#/components/schemas/RecipeStep"
        params:
          type: object
          additionalProperties: true

    KpiValue:
      type: object
      properties:
        value:
          type: [number, "null"]
        currency:
          type: [string, "null"]
        unit:
          type: string
        reason:
          type: string
          enum: [mixed_currencies, not_standardized, no_amount]
        scope:
          type: string
          enum: [dominant_currency]

    Issue:
      type: object
      required: [issue_id, issue_type, category, affected_rows, title, what, why, options]
      properties:
        issue_id:
          type: string
          example: mixed_currency:currency
        issue_type:
          type: string
          enum: [header_mapping, pii, duplicates, missing_values, time_zone, date_format, number_locale, mixed_currency, text_variants, category_labels, outliers, type_casting]
        category:
          type: string
          enum: [completeness, uniqueness, validity, consistency]
        category_label:
          type: string
        field:
          type: [string, "null"]
          description: Canonical field affected.
        affected_rows:
          type: integer
        position:
          type: integer
        of:
          type: integer
        params:
          type: object
          additionalProperties: true
        title:
          type: string
        what:
          type: string
        why:
          type: string
        learn_more:
          type: string
        fx_note:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/IssueOption"
        preview_columns:
          type: array
          items:
            type: string
        preview_before:
          type: array
          description: Example rows as written in the file (data values, never translated).
          items:
            type: array
            items: {}
        preview_after:
          type: object
          description: Example rows after each option, keyed by option_id; a trailing "__removed__" marks a removed row.
          additionalProperties:
            type: array
            items:
              type: array
              items: {}
        kpi_id:
          type: [string, "null"]
        kpi_label:
          type: [string, "null"]
        kpi_before:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/KpiValue"
        kpi_after:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/KpiValue"

    RecipeStep:
      type: object
      required: [op]
      properties:
        op:
          type: string
          example: convert_currency
        args:
          type: object
          additionalProperties: true

    RecipeInput:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
        dataset_id:
          type: [string, "null"]
          format: uuid
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RecipeStep"

    RecipeDocument:
      type: object
      description: Portable recipe file (what `format=json` downloads); no ids or timestamps.
      required: [schema, name, version, steps]
      properties:
        schema:
          type: string
          const: civiclens.recipe/v1
        name:
          type: string
        version:
          type: integer
          minimum: 1
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RecipeStep"
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeInput"
        - type: object
          required: [id, version, created_at]
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time

    ApplyRecipeRequest:
      type: object
      description: Either `recipe_id` or an inline `recipe`.
      oneOf:
        - required: [recipe_id]
          properties:
            recipe_id:
              type: string
              format: uuid
        - required: [recipe]
          properties:
            recipe:
              $ref: "#/components/schemas/RecipeInput"

    QueryRequest:
      type: object
      required: [dataset_id, sql]
      properties:
        dataset_id:
          type: string
          description: Dataset UUID, or the slug of a seed dataset.
          example: secop_co
        sql:
          type: string
          maxLength: 20000
          description: |
            Exactly one SELECT/WITH statement. Rejected (400, `sql.*` codes): writes and DDL,
            ATTACH/COPY/PRAGMA/SET/INSTALL/LOAD, file/URL readers, settings functions, multiple
            statements. Longer texts are rejected with `sql.too_long`.
          example: SELECT supplier_id, SUM(amount_cad) AS spend FROM fact_contract GROUP BY 1 ORDER BY 2 DESC LIMIT 10

    QueryResult:
      type: object
      required: [columns, rows, row_count, truncated, elapsed_ms]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        row_count:
          type: integer
        truncated:
          type: boolean
          description: True when the 10,000-row cap applied.
        elapsed_ms:
          type: integer

    GuidedQuery:
      type: object
      required: [query_id, title, question, sql, explanation]
      properties:
        query_id:
          type: string
          example: top_suppliers
        title:
          type: string
        question:
          type: string
        sql:
          type: string
        explanation:
          type: string
        source:
          type: string
          description: "`generic` (generated from the columns) or the domain pack it comes from."
          example: banking
        goals:
          type: array
          description: Analysis goals of the pack this question serves first.
          items:
            type: string
        concepts:
          type: array
          description: SQL concepts the query shows (e.g. `join`, `cte`, `GROUP BY`).
          items:
            type: string

    Kpi:
      type: object
      required: [kpi_id, value, name, definition]
      properties:
        kpi_id:
          type: string
          description: |
            Procurement catalog id (`total_spend`, `contract_count`, `avg_value`, `median_value`,
            `direct_award_share`, `hhi`, `single_bidder_share`, `yoy_growth`, `quality_score`),
            a pack KPI (`banking.default_rate`) or a table KPI (`generic.mean.<column>`).
          example: total_spend
        value:
          type: [number, "null"]
        unit:
          type: string
          enum: [currency, amount, number, count, ratio, index, score]
        currency:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Currency"
        owner:
          type: string
          description: Team accountable for the definition, or the domain pack that defines it.
          example: finance
        name:
          type: string
        definition:
          type: string
        formula_sql:
          type: [string, "null"]
          description: SQL over the star schema (identical in every language); null for `quality_score`.

    Guardrails:
      type: object
      required: [read_only, timeout_s, max_rows]
      properties:
        read_only:
          type: boolean
        timeout_s:
          type: integer
          example: 10
        max_rows:
          type: integer
          example: 10000

    StarOrigin:
      type: string
      description: "`clean`: built from the applied recipe; `recommended`: recommended recipe applied on the fly."
      enum: [clean, recommended]

    DashboardKpi:
      allOf:
        - $ref: "#/components/schemas/Kpi"
        - type: object
          properties:
            change:
              type: [number, "null"]
              description: Relative change against the previous period (0.068 = +6.8 %); null for `all`.
            change_points:
              type: [number, "null"]
              description: "`direct_award_share` only: change in share (0.03 = +3 points)."
            median:
              type: [number, "null"]
              description: "`avg_value` only: the median contract value in CAD."
            level:
              type: [string, "null"]
              enum: [unconcentrated, moderate, high, null]
              description: "`hhi` only (US DOJ/FTC 2023 thresholds: 0.10 and 0.18)."
            level_label:
              type: [string, "null"]
            before:
              type: [number, "null"]
              description: "`quality_score` only: the score before cleaning."

    Dashboard:
      type: object
      required: [filters, currency, kpis, monthly, finding, by_jurisdiction, notes]
      properties:
        filters:
          type: object
          properties:
            period:
              type: string
              enum: [all, 12m, fy]
            category:
              type: string
              enum: [all, goods, services, construction, other]
        currency:
          type: string
          const: CAD
        kpis:
          type: array
          items:
            $ref: "#/components/schemas/DashboardKpi"
        monthly:
          type: array
          items:
            type: object
            required: [month, spend, contracts]
            properties:
              month:
                type: string
                pattern: "^[0-9]{4}-[0-9]{2}$"
              spend:
                type: number
              contracts:
                type: integer
        peak:
          oneOf:
            - type: "null"
            - type: object
              required: [month, spend, ratio, is_peak]
              properties:
                month:
                  type: string
                spend:
                  type: number
                contracts:
                  type: integer
                ratio:
                  type: number
                  description: Peak month over the average month.
                is_peak:
                  type: boolean
                  description: True when the ratio is at least 2.
                flagged:
                  type: [integer, "null"]
                  description: Red-flagged contracts signed that month (null when the model has not run).
        finding:
          type: string
          description: Localized written finding about the monthly chart.
        by_jurisdiction:
          type: array
          items:
            type: object
            required: [dataset_id, jurisdiction, spend, contracts, share_of_max]
            properties:
              dataset_id:
                type: string
                format: uuid
              slug:
                type: [string, "null"]
              jurisdiction:
                type: string
                enum: [CO, CA, QC]
              name:
                type: string
              label:
                type: string
              spend:
                type: number
              contracts:
                type: integer
              share_of_max:
                type: number
                minimum: 0
                maximum: 1
              origin:
                $ref: "#/components/schemas/StarOrigin"
              window:
                type: object
                properties:
                  start:
                    type: [string, "null"]
                  end:
                    type: [string, "null"]
                  fiscal_year:
                    type: [integer, "null"]
        notes:
          type: array
          description: Localized data notes (currency conversion, excluded rows, cleaning state).
          items:
            type: string

    StarSchema:
      type: object
      required: [dataset_id, origin, tables, guardrails, data_columns, domain]
      properties:
        data_columns:
          type: array
          description: The columns of table `data`, in file order.
          items:
            $ref: "#/components/schemas/DataColumn"
        domain:
          $ref: "#/components/schemas/ActiveDomain"
        dataset_id:
          type: string
          format: uuid
        origin:
          $ref: "#/components/schemas/StarOrigin"
        guardrails:
          $ref: "#/components/schemas/Guardrails"
        tables:
          type: array
          items:
            type: object
            required: [name, role, rows, columns]
            properties:
              name:
                type: string
                enum: [data, fact_contract, dim_entity, dim_supplier, dim_date, dim_category, dim_currency]
              role:
                type: string
                enum: [data, fact, dimension]
              rows:
                type: integer
              columns:
                type: array
                items:
                  type: object
                  required: [name, type]
                  properties:
                    name:
                      type: string
                    type:
                      type: string

    DataColumn:
      type: object
      required: [name, source, kind, kind_label, sql_type, binary, nulls, distinct, examples]
      properties:
        name:
          type: string
          description: Safe SQL name in table `data`.
          example: emp_var_rate
        source:
          type: string
          description: The header as written in the file (never translated).
          example: emp.var.rate
        kind:
          $ref: "#/components/schemas/ColumnKind"
        kind_label:
          type: string
          description: Localized name of the kind.
        sql_type:
          type: string
          enum: [DOUBLE, BIGINT, BOOLEAN, DATE, TIMESTAMP, VARCHAR]
        binary:
          type: boolean
          description: Exactly two values (yes/no, 0/1).
        nulls:
          type: integer
        distinct:
          type: integer
        examples:
          type: array
          items:
            type: string

    ColumnKind:
      type: string
      enum: [number, integer, boolean, date, datetime, category, text, identifier]

    ActiveDomain:
      type: object
      required: [pack, goal, roles, confirmed, engine]
      properties:
        pack:
          type: string
          example: banking
        goal:
          type: string
          example: credit_risk
        confirmed:
          type: boolean
          description: false while CivicLens's suggestion has not been confirmed by the user.
        engine:
          type: string
          enum: [generic, procurement_star]
        roles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RoleMapping"

    RoleMapping:
      type: object
      required: [column]
      properties:
        column:
          type: string
          description: Column of table `data`.
        source:
          type: string
          description: Its header as written in the file.
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: How sure the automatic match is (1 = chosen by the user).
        positive:
          type: [string, "null"]
          description: Target roles only — the value that means "it happened" (default, converted …).

    Domain:
      type: object
      required: [dataset_id, pack, goal, confirmed, roles, suggestions, packs, columns, job]
      properties:
        dataset_id:
          type: string
          format: uuid
        pack:
          type: string
        goal:
          type: string
        confirmed:
          type: boolean
        roles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RoleMapping"
        suggestions:
          type: array
          description: Every pack with its fit score (0–1), best first; General is the floor (0.3).
          items:
            type: object
            required: [pack, score, name]
            properties:
              pack:
                type: string
              score:
                type: number
              name:
                type: string
        packs:
          type: array
          items:
            type: object
            required: [id, name, description, goals, roles]
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              goals:
                type: array
                items:
                  type: object
                  required: [id, name, default]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    default:
                      type: boolean
              roles:
                type: array
                items:
                  type: object
                  required: [id, name, kinds, key, target, sensitive]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    kinds:
                      type: array
                      description: Column kinds the role accepts; `binary` means any two-valued column.
                      items:
                        type: string
                        enum: [number, integer, boolean, date, datetime, category, text, identifier, binary]
                    key:
                      type: boolean
                    target:
                      type: boolean
                    sensitive:
                      type: boolean
                      description: Age, sex/gender, marital status, nationality — used only for fairness checks.
        columns:
          type: array
          items:
            type: object
            required: [name, source, kind, kind_label, binary, examples, top]
            properties:
              binary:
                type: boolean
              name:
                type: string
              source:
                type: string
              kind:
                $ref: "#/components/schemas/ColumnKind"
              kind_label:
                type: string
              examples:
                type: array
                items:
                  type: string
              top:
                type: array
                description: Most frequent values (categories and flags).
                items:
                  type: string
        job:
          description: The model rebuild started by a switch to or from the Government pack.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/JobRef"

    DomainChoice:
      type: object
      additionalProperties: false
      required: [pack]
      properties:
        pack:
          type: string
          minLength: 1
          maxLength: 40
          example: banking
        goal:
          type: [string, "null"]
          maxLength: 40
          description: Defaults to the pack's default goal.
        roles:
          description: Omit to accept the suggested mapping for this pack.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties:
                type: object
                additionalProperties: false
                required: [column]
                properties:
                  column:
                    type: string
                    minLength: 1
                    maxLength: 200
                  positive:
                    type: [string, "null"]
                    maxLength: 200

    ModelCard:
      type: object
      required: [name, question, method, warning, limitations, features]
      description: Localized with `Accept-Language`.
      properties:
        name:
          type: string
        question:
          type: string
        method:
          type: string
        method_detail:
          type: string
        warning:
          type: string
        limitations:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
              label:
                type: string
        rules:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                $ref: "#/components/schemas/RedFlagRule"
              label:
                type: string
        thresholds:
          type: string
        flagged_rule:
          type: string
        verdict:
          type: string
          description: Says plainly whether the model beats its baseline (or why it could not run).
        dropped:
          type: string
        notes:
          type: array
          description: Generic models — sampling, leakage warnings, sensitive attributes left out.
          items:
            type: string
        positive:
          type: string
        metric_labels:
          type: object
          additionalProperties:
            type: string

    GenericModelResult:
      type: object
      description: |
        `target_model`, `anomalies` or `segments` on table `data`. `status` is `ok` or why the
        model could not run (`no_target`, `unsupported_target`, `no_features`, `single_class`,
        `no_numbers`); the card's `verdict` explains it in the UI language.
      required: [model_type, status, card]
      properties:
        model_type:
          type: string
          enum: [target_model, anomalies, segments]
        status:
          type: string
          enum: [ok, no_target, unsupported_target, no_features, single_class, no_numbers]
        task:
          type: string
          enum: [binary, multiclass, regression]
        target:
          type: string
        positive:
          type: [string, "null"]
        seed:
          type: integer
        rows:
          type: integer
        rows_used:
          type: integer
        sampled:
          type: boolean
          description: true when the model was trained on a random sample (the card says so).
        features:
          type: array
          items:
            type: string
        excluded_sensitive:
          type: array
          items:
            type: string
        metrics:
          type: object
          additionalProperties:
            type: number
        baseline_metrics:
          type: object
          additionalProperties:
            type: number
        beats_baseline:
          type: boolean
        importance:
          type: array
          items:
            type: object
            required: [feature, importance, share]
            properties:
              feature:
                type: string
              label:
                type: string
              importance:
                type: number
              share:
                type: number
        leakage:
          type: array
          items:
            type: object
            required: [feature, strength, reason]
            properties:
              feature:
                type: string
              strength:
                type: number
              reason:
                type: string
                enum: [too_strong, name_and_strength]
        fairness:
          type: array
          items:
            type: object
            required: [attribute, column, groups, disparity_ratio, passes]
            properties:
              attribute:
                type: string
                enum: [age, sex, marital_status, nationality]
              column:
                type: string
              label:
                type: string
              verdict:
                type: string
              disparity_ratio:
                type: [number, "null"]
                description: Lowest group's share of positive predictions ÷ the highest's (four-fifths rule passes at ≥ 0.8).
              passes:
                type: boolean
              groups:
                type: array
                items:
                  type: object
                  required: [group, rows, actual_rate, flagged_rate]
                  properties:
                    group:
                      type: string
                    rows:
                      type: integer
                    actual_rate:
                      type: number
                    flagged_rate:
                      type: number
                    true_positive_rate:
                      type: [number, "null"]
                    false_positive_rate:
                      type: [number, "null"]
        flagged:
          type: integer
        flagged_share:
          type: number
        top:
          type: array
          description: anomalies — the most unusual rows, each with the column that makes it unusual.
          items:
            type: object
            required: [row, score, feature, z]
            properties:
              row:
                type: integer
              score:
                type: number
              feature:
                type: string
              label:
                type: string
              value:
                type: [number, "null"]
              median:
                type: number
              z:
                type: number
              why:
                type: string
              labels:
                type: object
                additionalProperties:
                  type: [string, "null"]
        k:
          type: integer
        silhouette:
          type: number
        segments:
          type: array
          items:
            type: object
            required: [segment, rows, share, traits]
            properties:
              segment:
                type: integer
              rows:
                type: integer
              share:
                type: number
              profile:
                type: string
              traits:
                type: array
                items:
                  type: object
        card:
          $ref: "#/components/schemas/ModelCard"

    RedFlagRule:
      type: string
      enum: [split_contract, under_threshold, single_bidder, fy_end_spike, new_large_supplier]

    RedFlagResult:
      type: object
      required: [model_type, seed, features, rules, contracts, flagged, items, card, reason_labels]
      properties:
        model_type:
          type: string
          const: red_flags
        seed:
          type: integer
          example: 42
        features:
          type: array
          items:
            type: string
        features_dropped:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RedFlagRule"
        contracts:
          type: integer
          description: Every contract in the star schema (the same count as the `contract_count` KPI).
        scored:
          type: integer
          description: Contracts with a positive amount and a signing date, which the model can score.
        unscored:
          type: integer
          description: "`contracts - scored`."
        flagged:
          type: integer
        rule_counts:
          type: object
          description: Contracts matching each rule (flagged or not).
          additionalProperties:
            type: integer
        reason_counts:
          type: object
          description: Among the flagged contracts, how many have each reason (a contract can have several).
          additionalProperties:
            type: integer
        reviewed:
          type: array
          items:
            type: string
        origin:
          $ref: "#/components/schemas/StarOrigin"
        items:
          type: array
          items:
            type: object
            required: [rank, contract_id, score, reasons, amount_cad]
            properties:
              rank:
                type: integer
              contract_id:
                type: string
              entity_name:
                type: [string, "null"]
              supplier_name:
                type: [string, "null"]
              signed_date:
                type: string
                format: date
              amount_cad:
                type: number
              score:
                type: number
                description: 0–1 ranking score (60 % anomaly percentile + 40 % rules).
              anomaly:
                type: number
              reasons:
                type: array
                items:
                  type: string
                  enum: [split_contract, under_threshold, single_bidder, fy_end_spike, new_large_supplier, unusual_pattern]
              contributions:
                type: array
                description: SHAP values (exact, interventional) on the anomaly score, top 10 items only.
                items:
                  type: object
                  required: [feature, value]
                  properties:
                    feature:
                      type: string
                    value:
                      type: number
              base_value:
                type: number
        reason_labels:
          type: object
          additionalProperties:
            type: string
        card:
          $ref: "#/components/schemas/ModelCard"

    ForecastResult:
      type: object
      required: [model_type, status, card]
      properties:
        generic:
          type: boolean
          description: true for any dataset (monthly totals of `metric_column` by `date_column`).
        date_column:
          type: [string, "null"]
        metric_column:
          type: [string, "null"]
          description: null = the number of rows per month.
        model_type:
          type: string
          const: forecast
        status:
          type: string
          enum: [ok, insufficient_history, no_date]
        seed:
          type: integer
        currency:
          type: [string, "null"]
          example: CAD
        months:
          type: integer
        test_months:
          type: integer
        dropped_recent_months:
          type: integer
        metrics:
          type: object
          properties:
            mape_model:
              type: [number, "null"]
            mape_baseline:
              type: [number, "null"]
            beats_baseline:
              type: boolean
        series:
          type: array
          items:
            type: object
            required: [month]
            properties:
              month:
                type: string
                example: 2025-03
              actual:
                type: [number, "null"]
              model:
                type: [number, "null"]
              baseline:
                type: [number, "null"]
        card:
          $ref: "#/components/schemas/ModelCard"

    JobRef:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"

    Job:
      type: object
      required: [id, type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ingest, profile, apply_recipe, build_schema, model_run, report]
        status:
          $ref: "#/components/schemas/JobStatus"
        dataset_id:
          type: [string, "null"]
          format: uuid
        result:
          type: [object, "null"]
          additionalProperties: true
        phase:
          type: [string, "null"]
          description: What the job is doing now.
          enum: [reading, profiling, detecting_issues, building_model, applying_recipe, training, done, null]
        phase_label:
          type: [string, "null"]
          description: The phase in the requested language.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: How far the whole job is, in percent.
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Problem"
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          example: cl_live_ab12cd34
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Full secret. Shown only in this response.
