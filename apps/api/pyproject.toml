[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens public-data analytics engine (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pandas>=3.0",  # copy-on-write is always on: the cleaning ops rely on it
  "pyarrow>=17",
  "openpyxl>=3.1",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "duckdb>=1.1",
  "scikit-learn>=1.5",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "pypdf>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.i18n" = ["en/*.yaml", "es/*.yaml"]
"app.core.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Deterministic demo-data generator: seeded PRNG on purpose, not for security.
"app/core/seed/dirty.py" = ["S311"]
# Generates SQL *text* for users to export (never executed against the app DB); long SQL
# fragments read better unwrapped.
"app/core/cleaning/codegen.py" = ["S608", "E501"]
# SQL kept as readable multi-line text for the SQL Lab.
"app/core/sql/guided.py" = ["E501"]
"app/core/sql/kpi_catalog.py" = ["E501"]
# Generated questions: SQL text built only from safe column names quoted by q() and literals
# escaped by lit(); executed through the read-only guard. Long SQL reads better unwrapped.
"app/core/analysis/questions.py" = ["S608", "E501"]
"app/services/analysis.py" = ["S608", "E501"]
"app/services/overview.py" = ["S608", "E501"]
# Tests run the exported script / SQL on temp files they create themselves.
"tests/**" = ["S603", "S608", "S311"]  # S311: seeded random test data
