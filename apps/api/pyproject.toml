[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens public-data analytics engine (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.i18n" = ["en/*.yaml", "es/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Deterministic demo-data generator: seeded PRNG on purpose, not for security.
"app/core/seed/dirty.py" = ["S311"]
# Generates SQL *text* for users to export (never executed against the app DB); long SQL
# fragments read better unwrapped.
"app/core/cleaning/codegen.py" = ["S608", "E501"]
# SQL kept as readable multi-line text for the SQL Lab.
"app/core/sql/guided.py" = ["E501"]
"app/core/sql/kpi_catalog.py" = ["E501"]
# Tests run the exported script / SQL on temp files they create themselves.
"tests/**" = ["S603", "S608"]
