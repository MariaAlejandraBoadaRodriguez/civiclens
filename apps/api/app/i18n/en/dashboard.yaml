# Executive dashboard texts (spec M5). Data values (names) are never translated.
jurisdictions:
  CO: Colombia
  CA: Canada (federal)
  QC: Québec
hhi:
  unconcentrated: unconcentrated
  moderate: moderately concentrated
  high: highly concentrated
finding:
  peak: "{month} spend is about {ratio}× the monthly average — a spike worth a second look."
  flat: "No month stands out: the highest, {month}, is {ratio}× the monthly average."
  flagged: "{n} of the contracts signed in {month} are on the review list."
  empty: There are not enough dated contracts in this selection to chart monthly spend.
notes:
  fx: "{place}: amounts converted from {currency} to CAD with the rate of each contract's signing month ({source})."
  missing: "{place}: {share} of the contracts have no usable amount and are left out of the totals."
  recommended: "{place}: no cleaning recipe applied yet; figures use the recommended cleaning options."
  flags: Flags are leads for human review, never accusations.
