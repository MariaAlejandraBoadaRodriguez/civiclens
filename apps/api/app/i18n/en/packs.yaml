# Domain packs: names, goals, semantic roles, KPIs and curated questions (app/core/packs).
# Question texts take the mapped columns' headers as {role} parameters.
general:
  name: General
  description: Any table. The analysis is generated from the columns themselves.
  goals:
    explore: Explore the data
  roles: {}
government:
  name: Government / public procurement
  description: Contracts with a buyer, a supplier, an amount and dates. Adds the procurement star schema, red flags and spend KPIs.
  goals:
    spend_overview: Spend overview
    integrity: Integrity and red flags
    concentration: Supplier concentration
  roles:
    contract_id: Contract ID
    entity_name: Buying entity
    supplier_name: Supplier
    signed_date: Signature date
    amount_original: Contract amount
    currency: Currency
    award_type: Award type
    n_bidders: Number of bidders
banking:
  name: Banking / credit
  description: Loans or clients with amounts, terms and a default (bad credit) flag. Adds credit-risk KPIs, questions and a fairness check.
  goals:
    credit_risk: Credit risk
    portfolio: Portfolio
    credit_profiling: Credit profiling
  roles:
    client_id: Client ID
    loan_amount: Loan amount
    balance: Balance / exposure
    days_past_due: Days past due
    default_flag: Default flag
    product: Product / purpose
    duration: Term / duration
    income: Income
    date: Date
    age: Age
    sex: Sex / gender
    marital_status: Marital status
    nationality: Nationality
  kpis:
    default_rate:
      name: Default rate
      definition: Share of loans whose default flag takes its positive (bad) value.
    total_exposure:
      name: Total exposure
      definition: Sum of the balance (or of the loan amount when there is no balance).
    avg_loan:
      name: Average loan
      definition: Mean loan amount.
    avg_duration:
      name: Average term
      definition: Mean term or duration of the loans, in the file's unit.
    past_due_share:
      name: More than 30 days past due
      definition: Share of loans more than 30 days past due.
    clients:
      name: Clients
      definition: Number of distinct client IDs.
  questions:
    default_rate_by_product:
      title: Default rate by {product}
      question: Which {product} values default the most?
      explanation: Loans and default rate ({default_flag}) per {product}, highest rate first.
    default_rate_by_amount_band:
      title: Default rate by {loan_amount} band
      question: Do larger loans default more often?
      explanation: Splits {loan_amount} into five equal-sized bands (quintiles) and shows the default rate of each.
    default_rate_by_duration_band:
      title: Default rate by {duration} band
      question: Do longer terms default more often?
      explanation: Splits {duration} into four equal-sized bands (quartiles) and shows the default rate of each.
    exposure_by_product:
      title: Exposure by {product}
      question: Where is the money lent?
      explanation: Total {loan_amount} and its share per {product}.
    past_due_buckets:
      title: Past-due buckets
      question: How late are the payments?
      explanation: Loans per bucket of {days_past_due} (current, 1–30, 31–60, 61–90, 90+ days).
    default_rate_by_age_band:
      title: Default rate by age band
      question: Does the default rate differ by {age}?
      explanation: Default rate per age band. Age is a sensitive attribute; use this to check fairness, not to decide on a person.
    default_rate_by_sex:
      title: Default rate by {sex}
      question: Does the default rate differ by {sex}?
      explanation: Default rate per group. Sex/gender is a sensitive attribute; differences call for a fairness review, not for using it in decisions.
marketing:
  name: Marketing / campaigns
  description: Leads or customers contacted by campaigns, with a conversion outcome. Adds conversion KPIs, campaign questions and a conversion-propensity model.
  goals:
    conversion: Conversion
    campaign_performance: Campaign performance
    segmentation: Segmentation
  roles:
    customer_id: Customer / lead ID
    converted: Converted (target)
    channel: Channel / contact type
    campaign: Campaign
    contacts: Contacts in this campaign
    previous_outcome: Previous campaign outcome
    month: Month / date of contact
    call_duration: Call duration
    revenue: Revenue
    segment: Segment / occupation
    age: Age
    marital_status: Marital status
  kpis:
    conversion_rate:
      name: Conversion rate
      definition: Share of leads whose conversion flag takes its positive value.
    contacts_per_lead:
      name: Contacts per lead
      definition: Average number of contacts made to each lead in the campaign.
    contacts_per_conversion:
      name: Contacts per conversion
      definition: Total contacts divided by the number of conversions — the effort behind each success.
    revenue:
      name: Revenue
      definition: Sum of the revenue column.
    leads:
      name: Leads
      definition: Number of rows with a known outcome.
  questions:
    conversion_by_channel:
      title: Conversion by {channel}
      question: Which {channel} converts best?
      explanation: Leads and conversion rate ({converted}) per {channel}, best first.
    conversion_by_contacts:
      title: Conversion by number of contacts
      question: Does calling more often pay off?
      explanation: Groups leads by {contacts} (1, 2, 3, 4–5, 6+) and shows the conversion rate of each group. Falling rates suggest diminishing returns.
    conversion_by_previous:
      title: Conversion by {previous_outcome}
      question: Do past successes convert again?
      explanation: Conversion rate per outcome of the previous campaign ({previous_outcome}).
    conversion_by_month:
      title: Conversion by {month}
      question: When do campaigns convert best?
      explanation: Leads and conversion rate per {month}, busiest first.
    conversion_by_segment:
      title: Conversion by {segment}
      question: Which {segment} converts best?
      explanation: Conversion rate per {segment} (groups of at least 20 leads), best first.
    conversion_by_campaign:
      title: Conversion by {campaign}
      question: Which campaigns perform best?
      explanation: Leads and conversion rate per {campaign}, largest first.
    conversion_by_age_band:
      title: Conversion by age band
      question: Does conversion differ by {age}?
      explanation: Conversion rate per age band. Age is a sensitive attribute; use it to check fairness and reach, not to exclude people.
environmental:
  name: Environmental / monitoring
  description: Measurements at stations over time (air or water quality, noise…). Adds limit compliance, trends and station comparisons, with a forecast and exceedance anomalies.
  goals:
    compliance: Compliance with limits
    trends: Trends and seasonality
    stations: Station comparison
  roles:
    station: Station / site
    pollutant: Pollutant / variable
    value: Measured value
    date: Date and time
    limit: Limit / standard
    unit: Unit
    city: City / area
  kpis:
    mean_value:
      name: Mean value
      definition: Average of all measurements, in the file's unit.
    max_value:
      name: Maximum value
      definition: Highest measurement in the file.
    exceedance_share:
      name: Measurements over the limit
      definition: Share of measurements above the limit (the limit column, else the pollutant's 24-hour standard of Colombian Resolution 2254/2017; confirm it for your jurisdiction and averaging period).
    stations:
      name: Stations
      definition: Number of distinct stations.
    measurements:
      name: Measurements
      definition: Number of measurements with a value.
  questions:
    exceedances_by_station:
      title: Exceedances by {station}
      question: Which stations exceed the limit most often?
      explanation: Measurements, exceedances (value above the limit) and their share per {station}, worst first, with the highest value.
    daily_means_over_limit:
      title: Days whose mean is over the limit
      question: On which days did the daily mean exceed the limit?
      explanation: Averages {value} per day of {date} and lists the days above the limit, worst first. 24-hour standards are about daily means, not single readings.
    monthly_trend:
      title: Monthly trend of {value}
      question: How does {value} change month by month?
      explanation: Mean and maximum of {value} per month of {date}.
    hour_of_day:
      title: "{value} by hour of day"
      question: At what time of day is {value} highest?
      explanation: Mean of {value} for each hour of {date}; daily cycles (traffic, heating) show up here.
    station_comparison:
      title: Stations compared
      question: How do the stations compare?
      explanation: Mean, median and 95th percentile of {value} per {station}, highest mean first.
