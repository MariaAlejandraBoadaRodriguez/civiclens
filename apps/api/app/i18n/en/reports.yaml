# Executive report texts (US-05). Data values (names, descriptions) are never translated.
title: Executive report
subtitle: "{dataset} · generated on {date}"
language: English
summary:
  heading: Summary
  text: "{contracts} contracts worth {total} in total. {direct} of them were direct awards, and supplier concentration (HHI) is {hhi}."
  quality: "The data quality score went from {before} to {after} with the cleaning recipe."
  quality_recommended: "No cleaning recipe has been applied yet: the figures use the recommended cleaning options (quality score {before})."
kpis:
  heading: Key figures
  currency_note: Amounts in CAD, converted with the rate of each contract's signing month.
monthly:
  heading: Monthly spend
  chart: "Monthly spend in CAD, {first} to {last}"
  peak: "Spend peaked in {month} at {amount}, {ratio} times the average month."
  flat: "No month stands out: the highest month is less than twice the average."
  empty: There are not enough dated contracts to show monthly spend.
suppliers:
  heading: Top suppliers
  supplier: Supplier
  spend: Spend
  share: Share of spend
red_flags:
  heading: Contracts to review
  text: "{flagged} of {contracts} contracts are flagged for human review. Most frequent reasons among the flagged contracts (one contract can have several): {reasons}."
  unscored: "{n} contracts have no positive amount or no signing date and could not be scored."
  not_run: The red-flag model has not been run on this dataset yet (ML lab).
  warning: Flags are leads for human review, never accusations.
forecast:
  heading: Spend forecast
  not_run: The spend forecast has not been run on this dataset yet (ML lab).
notes:
  heading: Data notes
  fx: "Currency conversion: {source}."
  values: Supplier and entity names are shown exactly as published; they are never translated.
  source: "Source: {publisher} — {license}."
  upload: "Source: a file uploaded to CivicLens ({name}). Uploaded files are deleted after 24 hours."
footer: "Generated by CivicLens · {date} · Report language: English"
