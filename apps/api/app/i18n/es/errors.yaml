# Textos de los problemas RFC 7807, por código de error estable.
ingest:
  unsupported_format:
    title: Tipo de archivo no admitido
    detail: "Carga un archivo CSV, XLSX o JSON. No se aceptan archivos .xls antiguos ni libros con macros."
  empty_file:
    title: El archivo está vacío
    detail: No encontramos filas en este archivo.
  too_large:
    title: Archivo demasiado grande
    detail: "El límite es de {limit_mb} MB por archivo."
  unreadable:
    title: No pudimos leer este archivo
    detail: El archivo parece dañado o no tiene el formato que indica su extensión.
dataset:
  not_found:
    title: Conjunto de datos no encontrado
    detail: "No existe un conjunto de datos con id {dataset_id}. Los archivos cargados se eliminan a las 24 horas."
  not_ready:
    title: El conjunto de datos todavía se está procesando
    detail: Vuelve a intentarlo en unos segundos.
job:
  not_found:
    title: Tarea no encontrada
    detail: "No existe una tarea con id {job_id}."
  out_of_memory:
    title: La tarea se quedó sin memoria
    detail: El archivo es demasiado grande para los 512 MB del servidor gratuito. Prueba con un archivo más pequeño o con menos filas; el resto de la aplicación sigue funcionando.
  crashed:
    title: La tarea se detuvo inesperadamente
    detail: El error quedó registrado. Inténtalo de nuevo; si vuelve a pasar, puede que el archivo tenga un formato que el motor no sabe leer.
request:
  invalid:
    title: Solicitud no válida
    detail: Uno o más campos no son válidos.
  not_found:
    title: No encontrado
    detail: No hay ninguna ruta de la API en esta dirección. Consulta /docs para ver las rutas disponibles.
  method_not_allowed:
    title: Método no permitido
    detail: "Esta ruta no acepta {method}. El encabezado Allow indica los métodos que acepta."
  malformed:
    title: No pudimos leer el cuerpo de la solicitud
    detail: Envía JSON válido (o un formulario multipart para las cargas de archivos).
server:
  internal:
    title: Algo salió mal de nuestro lado
    detail: El error quedó registrado. Vuelve a intentarlo en un momento.
recipe:
  invalid:
    title: La receta no es válida
    detail: "Paso {step}: {message}"
  not_found:
    title: Receta no encontrada
    detail: "No existe una receta con id {recipe_id}."
  failed:
    title: No se pudo aplicar la receta
    detail: Un paso falló en este archivo. El error quedó registrado.
sql:
  empty:
    title: Escribe primero una consulta
    detail: El editor está vacío.
  too_long:
    title: La consulta es demasiado larga
    detail: "Las consultas tienen un límite de {limit} caracteres."
  multiple_statements:
    title: Solo una sentencia a la vez
    detail: Elimina las sentencias adicionales después del primer punto y coma.
  forbidden_statement:
    title: Solo se permiten consultas de lectura
    detail: "El laboratorio SQL ejecuta solo consultas SELECT y WITH ({keyword} no está permitido)."
  forbidden_function:
    title: Esta función no está disponible
    detail: "{function} podría leer archivos, la red o la configuración del sistema, por eso está bloqueada."
  syntax_error:
    title: La consulta tiene un error de sintaxis
    detail: "DuckDB dice: {message}"
  runtime_error:
    title: La consulta falló
    detail: "DuckDB dice: {message}"
  timeout:
    title: La consulta tardó demasiado
    detail: "Las consultas se detienen a los {seconds} segundos. Agrega filtros o agrega antes de unir tablas."
model:
  not_available:
    title: Este modelo aún no está disponible
    detail: "{model_type} está previsto para una versión posterior. Disponibles ahora: red_flags, forecast."
  not_run:
    title: Este modelo no se ha ejecutado sobre este conjunto de datos
    detail: Ejecútalo primero con POST /api/v1/models/{model_type}/run.
  failed:
    title: La ejecución del modelo falló
    detail: Algo salió mal al entrenar el modelo. Inténtalo de nuevo; si sigue fallando, revisa el conjunto de datos en el Estudio de limpieza.
auth:
  invalid_key:
    title: Clave de API no válida
    detail: La clave de API no existe o fue revocada. Pide una nueva al administrador.
  missing_key:
    title: Se necesita una clave de API
    detail: "Esta operación necesita una clave de API con el permiso {scope} (encabezado X-API-Key)."
  insufficient_scope:
    title: La clave de API no permite esta operación
    detail: "Esta operación necesita el permiso {scope}. Pide al administrador una clave que lo incluya."
  admin_required:
    title: Se requiere iniciar sesión como administrador
    detail: El administrador gestiona las claves de API desde la aplicación web de CivicLens.
  admin_only:
    title: Solo el administrador puede gestionar claves de API
    detail: Las claves de API de las agencias no pueden crear, listar ni revocar claves.
api_key:
  not_found:
    title: Clave de API no encontrada
    detail: "No existe una clave de API con id {key_id}."
rate_limit:
  exceeded:
    title: Demasiadas solicitudes
    detail: "Espera {retry_after} segundos e inténtalo de nuevo."
