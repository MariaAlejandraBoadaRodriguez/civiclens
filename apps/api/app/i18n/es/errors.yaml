# Textos de los problemas RFC 7807, por código de error estable.
ingest:
  unsupported_format:
    title: Tipo de archivo no admitido
    detail: "Carga un archivo CSV, XLSX o JSON. No se aceptan archivos .xls antiguos ni libros con macros."
  empty_file:
    title: El archivo está vacío
    detail: No encontramos filas en este archivo.
  too_large:
    title: Archivo demasiado grande
    detail: "El límite es de {limit_mb} MB por archivo."
  unreadable:
    title: No pudimos leer este archivo
    detail: El archivo parece dañado o no tiene el formato que indica su extensión.
dataset:
  not_found:
    title: Conjunto de datos no encontrado
    detail: "No existe un conjunto de datos con id {dataset_id}. Los archivos cargados se eliminan a las 24 horas."
  not_ready:
    title: El conjunto de datos todavía se está procesando
    detail: Vuelve a intentarlo en unos segundos.
job:
  not_found:
    title: Tarea no encontrada
    detail: "No existe una tarea con id {job_id}."
request:
  invalid:
    title: Solicitud no válida
    detail: Uno o más campos no son válidos.
server:
  internal:
    title: Algo salió mal de nuestro lado
    detail: El error quedó registrado. Vuelve a intentarlo en un momento.
recipe:
  invalid:
    title: La receta no es válida
    detail: "Paso {step}: {message}"
  not_found:
    title: Receta no encontrada
    detail: "No existe una receta con id {recipe_id}."
  failed:
    title: No se pudo aplicar la receta
    detail: Un paso falló en este archivo. El error quedó registrado.
sql:
  empty:
    title: Escribe primero una consulta
    detail: El editor está vacío.
  too_long:
    title: La consulta es demasiado larga
    detail: "Las consultas tienen un límite de {limit} caracteres."
  multiple_statements:
    title: Solo una sentencia a la vez
    detail: Elimina las sentencias adicionales después del primer punto y coma.
  forbidden_statement:
    title: Solo se permiten consultas de lectura
    detail: "El laboratorio SQL ejecuta solo consultas SELECT y WITH ({keyword} no está permitido)."
  forbidden_function:
    title: Esta función no está disponible
    detail: "{function} podría leer archivos, la red o la configuración del sistema, por eso está bloqueada."
  syntax_error:
    title: La consulta tiene un error de sintaxis
    detail: "DuckDB dice: {message}"
  runtime_error:
    title: La consulta falló
    detail: "DuckDB dice: {message}"
  timeout:
    title: La consulta tardó demasiado
    detail: "Las consultas se detienen a los {seconds} segundos. Agrega filtros o agrega antes de unir tablas."
