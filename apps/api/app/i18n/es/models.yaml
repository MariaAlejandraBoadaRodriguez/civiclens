# Fichas de modelo del laboratorio de ML (spec M6): pregunta, método, reglas, variables, advertencia, límites.
red_flags:
  name: Detección de alertas
  question: ¿Qué contratos merecen una segunda mirada antes de que se reúna el comité de auditoría?
  method: Isolation Forest + 5 reglas transparentes
  method_detail: "Un Isolation Forest ({trees} árboles, semilla fija {seed}) mide qué tan inusual es cada contrato frente al resto; cinco reglas revisan patrones de riesgo conocidos. Puntaje = 60 % percentil de anomalía + 40 % reglas cumplidas (hasta dos)."
  warning: Las alertas son pistas para revisión humana, nunca acusaciones. Los resultados dependen de la calidad de los datos y de los umbrales definidos para cada jurisdicción.
  thresholds: "Umbrales de contratación usados ({currency}): {values}. Son aproximados: confírmalos para tu jurisdicción."
  flagged_rule: "Un contrato se marca cuando cumple dos reglas, está en el 1 % más inusual, o cumple una regla y está en el 10 % más inusual."
  limitations:
    l1: El modelo solo aprende lo que es habitual en este conjunto de datos; un patrón común a todos no se marca.
    l2: Si faltan número de ofertas o fechas, las reglas que los usan pierden fuerza; las variables sin información se excluyen.
    l3: Los umbrales y las ventanas de las reglas están simplificados; la ley de contratación tiene excepciones que las reglas no ven.
  rules:
    split_contract: Contratos fraccionados (mismo proveedor, ≤ 7 días)
    under_threshold: Monto justo por debajo de un umbral de contratación
    single_bidder: Oferente único en un proceso competitivo
    fy_end_spike: Pico de fin de año fiscal
    new_large_supplier: Proveedor nuevo y grande
  reasons:
    split_contract: Fraccionamiento
    under_threshold: Bajo el umbral
    single_bidder: Oferente único
    fy_end_spike: Pico de fin de año
    new_large_supplier: Proveedor nuevo y grande
    unusual_pattern: Patrón inusual
  features:
    amount_cad: Valor del contrato en CAD (escala logarítmica)
    days_to_fy_end: Días que faltan para el cierre del año fiscal
    n_bidders: Número de ofertas recibidas
    supplier_age_days: Días desde el primer contrato del proveedor
    entity_share: Proporción del gasto total de la entidad
    days_between_contracts: Días desde el contrato anterior entre la misma entidad y el mismo proveedor
    gap_to_threshold: Distancia por debajo del umbral más cercano (proporción del umbral)
forecast:
  name: Pronóstico de gasto
  question: ¿Cuánto se gastará en los próximos seis meses y qué tanto podemos confiar en la estimación?
  method: Gradient boosting frente a una línea base estacional ingenua
  method_detail: "Gradient boosting (semilla fija {seed}) con rezagos de 1, 2, 3 y 12 meses, la media de 3 meses y el mes del año, entrenado sobre el logaritmo del gasto. La línea base repite el mismo mes del año anterior. Ambos se prueban en los últimos {test} meses, que no vieron al entrenar."
  warning: Un pronóstico es un rango de valores plausibles, no una promesa. Los contratos grandes y puntuales hacen difícil predecir el gasto mensual.
  verdict_beats: "El modelo supera a la línea base: MAPE {model} frente a {baseline}."
  verdict_loses: "El modelo no supera a la línea base estacional ingenua (MAPE {model} frente a {baseline}). Usa la línea base para planear."
  insufficient: "No hay suficiente historia: {months} meses completos; el pronóstico necesita al menos {min}."
  dropped: "Los últimos {n} meses parecen aún no reportados (gasto muy inferior al del año anterior) y se excluyeron."
  limitations:
    l1: El MAPE ignora los meses sin gasto y crece rápido cuando el gasto real es pequeño.
    l2: El pronóstico supone que el próximo año se parece a los últimos seis; cambios de política o de presupuesto lo rompen.
    l3: Los totales están en CAD con tasas mensuales; los movimientos cambiarios alteran los montos en COP o USD.
  features:
    lag_1: Gasto un mes antes
    lag_2: Gasto dos meses antes
    lag_3: Gasto tres meses antes
    lag_12: Gasto en el mismo mes del año anterior
    mean_3: Media de los últimos tres meses
    month_of_year: Mes del año (estacionalidad)
classifier:
  name: Clasificador de categorías
segments:
  name: Segmentos
  question: ¿Qué grupos de filas parecidas contiene la tabla y qué distingue a cada uno?
  method: k-means sobre las cantidades y las categorías principales
  method_detail: "k-means (semilla fija {seed}) sobre las cantidades estandarizadas (recortadas en los percentiles 5 y 95) y las categorías principales; {k} segmentos elegidos por el coeficiente de silueta ({silhouette})."
  warning: Los segmentos describen los datos, no los explican. Otras columnas u otro número de segmentos dan grupos distintos.
  limitations:
    l1: k-means busca grupos redondos de tamaño parecido; puede no ver grupos alargados o muy pequeños.
    l2: Solo se usan cantidades y categorías de hasta 12 valores; el texto libre y los identificadores quedan fuera.
    l3: Las tablas grandes se muestrean, así que los segmentos pequeños pueden cambiar entre corridas con otros datos.
  profile: "Segmento {n} ({share} de las filas): {traits}"
  typical: cerca de los valores típicos de la tabla
  trait_higher: "{column} más alto (mediana {value} vs {overall})"
  trait_lower: "{column} más bajo (mediana {value} vs {overall})"
  trait_category: "más a menudo {column} = {value} ({share} vs {overall})"
target_model:
  name: Modelo de predicción
  question: ¿Qué filas probablemente tendrán el resultado que eliges y qué lo explica?
  questions:
    binary: "¿Qué filas probablemente tendrán {target} = sí y qué lo explica?"
    multiclass: "¿Qué {target} tendrá cada fila y qué lo explica?"
    regression: "¿Qué valor de {target} esperar en cada fila y qué lo explica?"
  method: Gradient boosting frente a una línea base ingenua
  method_detail: "Gradient boosting por histogramas (semilla fija {seed}) entrenado con {train} filas y evaluado con {test} filas que no vio (partición estratificada). Línea base: {baseline}. Importancia: cuánto baja el puntaje de prueba cuando se desordena una columna (importancia por permutación)."
  baselines:
    majority_class: predecir siempre el valor más común
    mean: predecir siempre el promedio
  warning: Un modelo encuentra patrones, no causas. Revisa las alertas de fuga de información y la revisión de equidad antes de usar predicciones sobre personas.
  verdict_beats: "El modelo supera a la línea base: {metric} {model} vs {baseline}."
  verdict_loses: "El modelo no supera a la línea base ({metric} {model} vs {baseline}). Las columnas no predicen bien este resultado."
  positive: "Valor positivo de {target}: {value}"
  metrics:
    roc_auc: AUC ROC
    average_precision: Precisión promedio
    accuracy: Exactitud
    precision: Precisión
    recall: Sensibilidad
    threshold: Umbral del puntaje
    positive_rate: Proporción de positivos
    f1_macro: F1 (macro)
    mae: Error absoluto medio
    rmse: Raíz del error cuadrático medio
    r2: R²
  leakage:
    too_strong: "Posible fuga de información: {column} por sí sola predice el resultado casi perfectamente (fuerza {strength}). Verifica que se conozca antes del resultado; si no, quítala."
    name_and_strength: "Posible fuga de información: {column} parece medirse después del resultado y lo predice con fuerza (fuerza {strength}). Quítala para tener un modelo que sirva por adelantado."
  sensitive_excluded: "Atributos sensibles excluidos de las entradas: {columns}. Se usan solo para la revisión de equidad."
  fairness:
    passes: "Equidad según {column}: la proporción de filas marcadas del grupo más bajo es {ratio} × la del más alto (≥ 0,8 cumple la regla de los cuatro quintos)."
    fails: "Alerta de equidad según {column}: la proporción de filas marcadas del grupo más bajo es solo {ratio} × la del más alto (< 0,8). Revísalo antes de usar el modelo para decidir sobre personas."
  limitations:
    l1: El puntaje de prueba sale de una sola partición de este archivo; los datos nuevos pueden comportarse distinto.
    l2: Las categorías con más de 60 valores, el texto libre y los identificadores no se usan como entradas.
    l3: La importancia muestra en qué se apoya el modelo, no qué causa el resultado.
anomalies:
  name: Filas inusuales
  question: ¿Qué filas no se parecen al resto y merecen una segunda mirada?
  method: Isolation Forest sobre las cantidades
  method_detail: "Un Isolation Forest (150 árboles, semilla fija {seed}) mide qué tan fácil es aislar cada fila de las demás; se nombra la columna más inusual de la fila (puntaje z robusto frente a la mediana)."
  warning: Inusual no es incorrecto. Una fila marcada puede ser un error de datos, un caso raro pero válido o la fila más interesante de la tabla.
  verdict: "{flagged} filas ({share}) se ven inusuales."
  why_high: "{column} = {value}, muy por encima de lo usual ({median})"
  why_low: "{column} = {value}, muy por debajo de lo usual ({median})"
  limitations:
    l1: Solo se usan cantidades; una combinación inusual de categorías no se detecta.
    l2: Los valores faltantes se reemplazan por la mediana antes de calcular el puntaje.
    l3: La proporción de filas marcadas la elige el modelo; lee el orden, no el conteo.
forecast_any:
  name: Pronóstico
  question: ¿Qué viene para la cantidad principal en el tiempo y podemos confiar en la estimación?
  method: Gradient boosting frente a una línea base estacional ingenua
  method_detail: "Totales mensuales de {metric} por {date}. Gradient boosting (semilla fija {seed}) con rezagos de 1, 2, 3 y 12 meses, una media de 3 meses y el mes del año. La línea base repite el mismo mes del año anterior. Ambos se evalúan en los últimos {test} meses que no vieron."
  rows: el número de filas
  warning: Un pronóstico es un rango de valores plausibles, no una promesa.
  limitations:
    l1: Necesita al menos 24 meses completos; los datos más cortos o más finos no se pronostican.
    l2: El MAPE crece rápido cuando los valores reales son pequeños.
    l3: El pronóstico supone que los próximos meses se parecerán al pasado reciente.
generic:
  sampled: "Entrenado con una muestra aleatoria de {rows} de {total} filas para caber en memoria (semilla fija)."
  sensitive:
    age: Edad
    sex: Sexo / género
    marital_status: Estado civil
    nationality: Nacionalidad
  status:
    no_target: "Esta tabla no tiene una columna sí/no para predecir. Elige una columna objetivo para entrenar un modelo."
    unsupported_target: Esta columna no se puede predecir (texto libre, identificadores o un solo valor). Elige una marca, una categoría de hasta 20 valores o una cantidad.
    no_features: No hay columnas de entrada utilizables además del objetivo.
    single_class: El objetivo tiene un solo valor en las filas que lo tienen; no hay nada que predecir.
    no_numbers: La tabla no tiene cantidades que evaluar; las filas inusuales necesitan al menos una columna numérica.
    no_date: La tabla no tiene una columna de fecha, así que no hay nada que pronosticar.
