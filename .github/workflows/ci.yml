name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civiclens
          POSTGRES_PASSWORD: civiclens
          POSTGRES_DB: civiclens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civiclens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://civiclens:civiclens@localhost:5432/civiclens_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing

  web:
    name: Web · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  openapi:
    name: OpenAPI · spectral lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @stoplight/spectral-cli@6.14.2 lint openapi.yaml --fail-severity warn

  i18n:
    name: i18n · EN/ES catalogs match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python scripts/check_i18n.py

  security:
    name: Security · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker · API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t civiclens-api .

  a11y:
    name: Web · axe on design + dataset pages (EN + ES)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start the API (SQLite) so dataset pages render real data
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:////tmp/civiclens-a11y.db
          DATA_DIR: /tmp/civiclens-a11y
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          npx --yes wait-on@8.0.1 http://localhost:8000/health --timeout 60000
          curl -sf http://localhost:8000/api/v1/datasets > /dev/null
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start server and run axe
        env:
          API_URL: http://localhost:8000
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8.0.1 http://localhost:3000/en --timeout 60000
          npm run test:a11y
