name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civiclens
          POSTGRES_PASSWORD: civiclens
          POSTGRES_DB: civiclens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civiclens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://civiclens:civiclens@localhost:5432/civiclens_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing

  web:
    name: Web · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  openapi:
    name: OpenAPI · spectral lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @stoplight/spectral-cli@6.14.2 lint openapi.yaml --fail-severity warn

  contract:
    name: API · contract (Schemathesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "apps/api" "schemathesis==4.33.0"
      - run: scripts/contract_check.sh

  i18n:
    name: i18n · EN/ES catalogs match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python scripts/check_i18n.py

  security:
    name: Security · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack:
    # Production conditions: the API Docker image in 512 MB (Render free), the web build.
    # Fails on any 5xx, network drop, failed job, missing CORS header, console error or OOM kill.
    name: Stack · API in 512 MB — full flow + E2E (EN/ES)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the API image (also builds the seed datasets)
        run: docker build -f apps/api/Dockerfile -t civiclens-api .
      - name: Throwaway admin secrets for this run (the E2E admin journey)
        run: |
          echo "ADMIN_API_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run it with the production memory limit (512 MB, no swap)
        run: |
          docker run -d --name api --memory=512m --memory-swap=512m -p 8000:8000 \
            -e ADMIN_API_TOKEN \
            -e ALLOWED_ORIGINS='["http://localhost:3000","http://127.0.0.1:3000"]' civiclens-api
          npx --yes wait-on@8.0.1 http-get://127.0.0.1:8000/health --timeout 120000 || (docker logs api; exit 1)
      - name: Demo upload files
        run: |
          pip install -e apps/api
          python scripts/make_dirty.py --out /tmp/demo
      - name: Full flow on the three seeds (uploads, every preview, apply, SQL, models)
        run: python scripts/flow_check.py --base "$API_URL" --mode full --files /tmp/demo --origin "$WEB_ORIGIN"
      - name: Build and start the web against that API
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
          # Admin console in test mode: password-less sign-in as the allowlisted login
          # (refused on Vercel by lib/admin/access.ts).
          ADMIN_TEST_LOGIN: "true"
          ADMIN_GITHUB_LOGIN: e2e-admin
          NEXTAUTH_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          API_URL="$API_URL" nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          npx --yes wait-on@8.0.1 http://localhost:3000/en --timeout 60000
      - name: E2E journeys in /en and /es (fail on any console error)
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: No OOM kill, API still up
        run: |
          echo "memory.peak: $(docker exec api cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) bytes"
          events=$(docker exec api cat /sys/fs/cgroup/memory.events)
          echo "$events"
          oom=$(echo "$events" | awk '$1=="oom_kill"{print $2}')
          test "$(docker inspect -f '{{.State.Running}} {{.State.OOMKilled}}' api)" = "true false"
          test "${oom:-0}" = "0" || (echo "::error::$oom process(es) were OOM-killed in 512 MB"; exit 1)
          curl -sf "$API_URL/health"
      - name: API log
        if: failure()
        run: docker logs api 2>&1 | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  a11y:
    name: Web · axe on design + dataset pages (EN + ES)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start the API (SQLite) so dataset pages render real data
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:////tmp/civiclens-a11y.db
          DATA_DIR: /tmp/civiclens-a11y
        run: |
          pip install -e .
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          # 127.0.0.1, not localhost: Node resolves localhost to ::1 first.
          npx --yes wait-on@8.0.1 http-get://127.0.0.1:8000/health --timeout 120000 || (cat /tmp/api.log; exit 1)
          curl -sf --max-time 300 http://127.0.0.1:8000/api/v1/datasets > /dev/null || (cat /tmp/api.log; exit 1)
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start server and run axe
        env:
          API_URL: http://127.0.0.1:8000
        run: |
          npx next start -p 3000 &
          npx --yes wait-on@8.0.1 http://localhost:3000/en --timeout 60000
          npm run test:a11y
